name: Build DragonEggSolo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build plugin
        run: mvn -B package

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DragonEggSolo
          path: target/*.jar
